<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prueba de icono · A la cancha</title>
<style>
:root{font-family:Arial,sans-serif;color:#10252b;background:#eef3f0}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:680px;margin:auto}h1{font-size:1.3rem;margin:0 0 24px}.panel{background:#fff;padding:20px;margin:0 0 12px;border-radius:14px}h2{font-size:.9rem;margin:0 0 14px}.comparison{display:flex;flex-wrap:wrap;gap:18px;align-items:end}.sample{text-align:center;font-size:.75rem;color:#486056}.icon{width:72px;height:72px;display:grid;place-items:center;border-radius:18px;background:#fff;box-shadow:0 2px 16px #10252b22;overflow:hidden}.icon img{width:100%;height:100%;object-fit:contain}.icon.candidate img{width:94%;height:94%}.icon.small{width:48px;height:48px;border-radius:12px}.icon.dark{background:#10252b}.wordmark{max-width:320px;width:100%;display:block}.hint{font-size:.76rem;line-height:1.45;color:#486056;margin:14px 0 0}
</style></head><body><main><h1>Prueba de logo</h1><section class="panel"><h2>Icono instalado</h2><div class="comparison"><div class="sample"><div class="icon"><img src="../../apps/web/public/icons/icon-192.png" alt="Icono actual"></div><p>Actual · 72 px</p></div><div class="sample"><div class="icon candidate"><img src="icono-propuesta.png" alt="Icono nuevo propuesto"></div><p>Propuesta · 72 px</p></div><div class="sample"><div class="icon small candidate"><img src="icono-propuesta.png" alt="Icono nuevo pequeño"></div><p>Propuesta · 48 px</p></div><div class="sample"><div class="icon dark candidate"><img src="icono-propuesta.png" alt="Icono nuevo sobre fondo oscuro"></div><p>Fondo oscuro</p></div></div><p class="hint">La propuesta conserva la A de césped de la imagen enviada. Es una vista de prueba: el icono instalado actual sigue igual.</p></section><section class="panel"><h2>Imagen completa recibida</h2><img class="wordmark" src="logo-original.png" alt="Logo A la cancha original"></section></main></body></html>
